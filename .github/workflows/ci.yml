name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.go')
          if [ -n "$files" ]; then
            unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
            if [ -n "$unformatted" ]; then
              printf 'Run gofmt on:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      - name: Check dependency integrity
        run: go mod verify
      - name: Check dependency license inventory
        shell: bash
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          go run ./scripts/licenses --output "$temp_dir"
          diff -ru licenses "$temp_dir"
      - name: Test with the race detector (Unix)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test without race detector (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build the standalone executable
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o telegram-jsonl-ci .
